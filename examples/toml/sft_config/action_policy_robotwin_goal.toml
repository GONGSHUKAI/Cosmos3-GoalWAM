# ============================================================================
# RoboTwin action-policy SFT with GOAL-IMAGE conditioning — run config for the
# `action_policy_robotwin_nano_goal` experiment (reasoner-branch goal image
# through the frozen Qwen3-VL vision tower; see the experiment SKU for the
# cond / goal_layout switches). Only run-level scalars live here.
#
# Env required:
#   ROBOTWIN_ROOT=/path/to/<task>_lerobot_v3.0   # aloha-agilex lerobot v3.0 dir
#   BASE_CHECKPOINT_PATH=<Cosmos3-Nano DCP dir>
#   WAN_VAE_PATH=<Wan2.2_VAE.pth>
#   IMAGINAIRE_OUTPUT_ROOT=/path/to/output_root   # persist checkpoints
# The Qwen3-VL-8B HF snapshot must be available (HF cache) to seed the ViT.
# ============================================================================

[job]
task         = "vfm"
experiment   = "action_policy_robotwin_nano_goal"
project      = "cosmos3_action"
group        = "action_sft"
name         = "action_policy_robotwin_goal"
wandb_mode   = "online"

[model]
precision = "bfloat16"

[model.parallelism]
data_parallel_shard_degree     = 8    # 8-GPU model shard; set replicate for multi-node HSDP
data_parallel_replicate_degree = 1

[model.activation_checkpointing]
mode           = "full"
save_ops_regex = ["fmha"]

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[scheduler]
cycle_lengths = [100000]   # match max_iter

[trainer]
max_iter     = 100000
logging_iter = 1

[checkpoint]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter = 1000

# max_samples_per_batch is 128 in the experiment. Goal modes add 80-120 AR
# tokens per sample plus a frozen ViT forward; on lower-memory GPUs reduce it:
#   --opts dataloader_train.max_samples_per_batch=96
